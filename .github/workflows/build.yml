name: Build & publish (Windows + Linux)

# Builds the Workkk desktop agent for Windows + Linux from the PRIVATE source repo
# (applitz/workkk-desktop) and publishes the installers + auto-update artifacts to
# THIS public repo's Releases. Runs on the public repo so it uses unlimited free
# GitHub Actions minutes + storage, while the source stays private.
#
# macOS is built locally on a Mac with `pnpm release` (avoids a CI arch-naming pitfall
# for the .app.tar.gz updater artifact) — this workflow only adds Windows + Linux to
# the same v<version> release.
#
# Required secrets (Settings -> Secrets and variables -> Actions on THIS repo):
#   SRC_TOKEN                            PAT that can read applitz/workkk-desktop and
#                                        write applitz/workkk-official (classic PAT with
#                                        `repo` scope, or a fine-grained PAT on those two
#                                        repos with Contents: Read/Write).
#   TAURI_SIGNING_PRIVATE_KEY            Contents of ~/.workkk/updater.key (the minisign
#                                        private key whose pubkey is in tauri.conf.json).
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   Its password (set to an empty value if none).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Private source ref to build (branch / tag / sha)'
        required: false
        default: 'main'
      version:
        description: 'Version override (default: read desktop/package.json)'
        required: false

permissions:
  contents: write # create/update Releases in THIS (public) repo

env:
  SRC_REPO: applitz/workkk-desktop
  OFFICIAL_REPO: applitz/workkk-official

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04 # newer pipewire/spa headers for xcap's libspa crate
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-13 # Intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(node -pe "require('./package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V for ${{ matrix.target }}"

      - name: Install Linux build deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libglib2.0-dev libdbus-1-dev libclang-dev \
            libxss-dev libxdo-dev libxtst-dev libxi-dev libx11-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libwayland-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # ── Windows / Linux ──────────────────────────────────────────────────────
      # tauri-action builds, signs the updater artifacts, and uploads straight to the
      # release. No macOS arch-collision here, so the built-in uploader is fine.
      - name: Build, sign & upload (Windows / Linux)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          WORKKK_DEFAULT_API: https://api.workkk.tech # compile-time API base (config.rs)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # publishes to THIS public repo
        with:
          projectPath: .
          tagName: v${{ steps.v.outputs.version }}
          releaseName: 'Workkk v${{ steps.v.outputs.version }}'
          releaseBody: 'See the assets below to download and install Workkk.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # ── macOS ────────────────────────────────────────────────────────────────
      # Both mac archs emit an updater artifact named "Workkk.app.tar.gz", which would
      # collide in one release, so we build here (Developer ID sign + notarize) WITHOUT
      # letting tauri-action upload, then rename arch-tagged and upload ourselves.
      - name: Prepare notary API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign & notarize (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          WORKKK_DEFAULT_API: https://api.workkk.tech
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_PATH is exported to $GITHUB_ENV in the step above.
        with:
          projectPath: .
          args: --target ${{ matrix.target }} # no tagName → build only, don't upload

      - name: Upload macOS artifacts (arch-tagged) to the release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          arch="${{ matrix.arch }}"
          tag="v${{ steps.v.outputs.version }}"
          stage="$(mktemp -d)"
          cp "$bundle"/dmg/*.dmg "$stage"/                                  # Workkk_<ver>_<arch>.dmg
          cp "$bundle"/macos/*.app.tar.gz "$stage/Workkk_${arch}.app.tar.gz"
          cp "$bundle"/macos/*.app.tar.gz.sig "$stage/Workkk_${arch}.app.tar.gz.sig"
          echo "Uploading:"; ls -la "$stage"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$stage"/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$stage"/* --repo "${{ github.repository }}" \
              --title "Workkk $tag" \
              --notes "See the assets below to download and install Workkk."
          fi

  # Regenerate the site's release manifest so workkk.tech (download page + auto-updater)
  # picks up the new Windows + Linux artifacts. Commits to applitz/workkk-official.
  manifest:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout private source (for the manifest script)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          path: src

      - name: Checkout official site
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OFFICIAL_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          path: official

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(node -pe "require('./src/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Regenerate release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reads THIS public repo's release assets
        run: |
          node src/scripts/gen-release-manifest.mjs \
            --version "${{ steps.v.outputs.version }}" \
            --official official

      - name: Commit manifest to the official site (auto-deploys)
        working-directory: official
        run: |
          git config user.name "workkk-release-bot"
          git config user.email "release@workkk.tech"
          git add src/releases/releases.json
          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "release(desktop): win+linux for v${{ steps.v.outputs.version }}"
            git push
          fi
